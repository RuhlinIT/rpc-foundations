name: DCO
on:
  pull_request:
permissions:
  contents: read
jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "Missing sign-off: $(git log -1 --format='%h %s' "$c")"; missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then echo "Add a sign-off with: git commit -s --amend (or rebase with --signoff)"; exit 1; fi
